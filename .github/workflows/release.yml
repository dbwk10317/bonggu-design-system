name: Release

# Tags publish. Version bump (changeset version) and tagging happen locally; this only verifies
# and uploads. Pushes to main publish nothing. See RULE.md "릴리스".
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Auth is Trusted Publishing (OIDC): npm exchanges GitHub's id-token for a short-lived publish token, so the
# repo holds no secret. The npmjs package's Trusted Publisher must list this repo and this workflow file name.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # No registry-url: with it, setup-node writes an .npmrc that reads NODE_AUTH_TOKEN, and OIDC
      # publishing needs that line absent. The default registry is npmjs.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1; an older runner npm fails publish with ENEEDAUTH.
      - name: Verify npm supports trusted publishing
        run: |
          v="$(npm --version)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm ' + process.argv[1] + ' < 11.5.1'); process.exit(1) }" "$v"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify release candidate
        run: npm test
      # A tag/package.json mismatch would leave the tagged commit and the registry version out of sync;
      # that's irreversible, so block it before publishing.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "태그 ${GITHUB_REF_NAME}와 package.json ${pkg}가 다릅니다"; exit 1; }
      # prerelease → next, stable → latest (left to the default, a beta would take latest).
      # provenance is attached automatically on OIDC publishes.
      # On a failed OIDC exchange npm logs the reason only at verbose level and exits ENEEDAUTH, hence verbose.
      - name: Publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          echo "npm $(npm --version)"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && echo "id-token: available" || echo "id-token: MISSING"
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish --tag latest ;;
          esac
