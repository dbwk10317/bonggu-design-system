name: Release

# 태그가 발행이다. 버전 확정(changeset version)과 태그 생성은 로컬에서 하고, 여기서는
# 검증하고 올리기만 한다. main 푸시로는 아무것도 발행되지 않는다.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 인증은 Trusted Publishing(OIDC)이다. npm이 GitHub의 id-token 을 짧은 발행 토큰으로 바꿔 쓰므로
# 저장소에 시크릿이 없다. npmjs 패키지 설정의 Trusted Publisher 에 이 저장소와 이 파일 이름이 등록돼 있어야 한다.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # registry-url 을 주지 않는다. 주면 setup-node 가 NODE_AUTH_TOKEN 을 읽는 .npmrc 를 만들고,
      # OIDC 발행에는 그 줄이 없어야 한다. 기본 레지스트리가 npmjs 다.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # Trusted Publishing 은 npm 11.5.1 부터다. 러너의 npm 이 그보다 낮으면 publish 가 ENEEDAUTH 로 죽는다.
      - name: Verify npm supports trusted publishing
        run: |
          v="$(npm --version)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm ' + process.argv[1] + ' < 11.5.1'); process.exit(1) }" "$v"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify release candidate
        run: npm test
      # 태그와 package.json이 어긋난 채로 올라가면 태그가 가리키는 커밋과 레지스트리의
      # 버전이 달라진다. 되돌릴 수 없으므로 올리기 전에 막는다.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "태그 ${GITHUB_REF_NAME}와 package.json ${pkg}가 다릅니다"; exit 1; }
      # prerelease는 next, 정식은 latest. 기본값에 맡기면 beta가 latest를 가져간다.
      # provenance 는 OIDC 발행에서 자동으로 붙는다.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish --tag latest ;;
          esac
