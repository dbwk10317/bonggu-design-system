<style>body{padding:24px;display:grid;gap:24px;align-content:start}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}.lbl{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-bottom:10px}.sec{display:grid;gap:10px;min-width:0}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.Ds_d3ea90;

const { MascotMark, Grid } = NS;
const faces = ["neutral","curious","surprised","smiling","crying","worried","sleepy","excited","blank"];
const sizes = {xxs:16,xs:24,sm:32,md:48,lg:64,xl:96,xxl:128};
const labels = ['기본','궁금','놀람','미소','울음','걱정','졸림','신남','얼굴 없음'];
function App(){ return <div className="sec"><h1 style={{fontSize:'var(--fs-title)'}}>봉구 마스코트</h1><p>기본 크기는 MD 48px입니다. 표정은 24px 이상에서 사용합니다.</p><div className="row" style={{gap:'var(--sp-5)',alignItems:'end'}}>{Object.entries(sizes).map(([s,n])=><div key={s} style={{display:'grid',justifyItems:'center',gap:'var(--sp-2)'}}><MascotMark size={s}/><span className="bds-mono">{s.toUpperCase()} · {n}px</span></div>)}</div><Grid cols={3}>{faces.map((f,i)=><div key={f} style={{border:'1px solid var(--line)',borderRadius:'var(--radius-panel)',padding:'var(--panel-pad)',display:'grid',gap:'var(--sp-3)'}}><div className="row"><MascotMark face={f}/><span>{labels[i]} · <span className="bds-mono">{f}</span></span></div><div className="row">{Object.entries(sizes).map(([s,n])=><div key={s} style={{display:'grid',justifyItems:'center',gap:'var(--sp-1)'}}><MascotMark face={f} size={s} animated={false}/><span className="bds-mono" style={{fontSize:'var(--fs-caption)'}}>{n}</span></div>)}</div></div>)}</Grid></div>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
