<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body><div id="root"></div>

      <Panel caption="캡션 카드" sunken><p className="bds-card-copy">sunken은 중첩된 안쪽 패널에.</p></Panel>

    <div className="sec"><div className="lbl">Container narrow(760) · Visible above/below md</div><Container narrow><div className="box" style={{textAlign:"center"}}>Container narrow · max 760 · 중앙</div></Container><Inline><Visible above="md"><span className="box">≥768에서만 보임</span></Visible><Visible below="md"><span className="box">&lt;768에서만 보임</span></Visible></Inline></div>
