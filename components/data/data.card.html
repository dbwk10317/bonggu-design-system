<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Data</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card.css"><script src="../../theme-toggle.js" defer></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style></style></head>
<body class="bds-demo-page"><div id="root"></div>
<script type="text/babel">
const NS = window.Ds_d3ea90;
const { Chart, StatTile, BarList, KeyValues, CardHead, DataTable, LogViewer, DescriptionList, StatusPill, Panel, Tag, Heatmap, Timeline, DiffView, Gauge, TrendDelta, Legend, UptimeBar, Stack } = NS;
const R = (s) => { let x = s; return () => (x = (x * 9301 + 49297) % 233280) / 233280; };



const t = ["18:00","18:10","18:20","18:30","18:40","18:50","19:00","19:10","19:20","19:30","19:40","19:50"];
const rx=[12,18,15,22,null,null,31,28,26,35,40,38], tx=[4,6,5,8,7,9,10,8,12,11,9,13];
function Basic(){ return <>
  <div className="bds-demo-section"><div className="bds-demo-label">Chart · area / bar / line</div><div className="bds-demo-grid-3">
    <Panel padding="sm"><CardHead title="네트워크" meta="enp129s0" metaMono /><Chart kind="area" aria-label="네트워크" height={150} labels={t} xTicks="ends" series={[{label:"수신",tone:"rx",values:rx},{label:"송신",tone:"tx",values:tx}]} valueFormatter={v=>v+" Mb/s"} /></Panel>
    <Panel padding="sm"><CardHead title="모델 요청" meta="1시간" /><Chart kind="bar" aria-label="요청" height={150} labels={t.slice(0,8)} stacked series={[{label:"성공",tone:2,values:[40,52,38,61,70,55,63,72]},{label:"오류",tone:5,values:[2,1,4,0,3,2,1,5]}]} /></Panel>
    <Panel padding="sm"><CardHead title="CPU 온도" meta="°C" /><Chart kind="line" aria-label="온도" height={150} labels={t} xTicks="ends" series={[{label:"CPU",tone:1,values:[52,55,58,61,63,66,70,72,69,65,62,60]}]} thresholds={[{value:75,label:"위험 75",tone:"crit"}]} showLegend={false} /></Panel>
  </div></div>
  <div className="bds-demo-section"><div className="bds-demo-label">Chart · radial / pie / radar · KeyValues</div><div className="bds-demo-grid-3">
    <Panel padding="sm"><CardHead title="CPU" meta="Ryzen 9 7950X" metaMono /><div style={{display:"flex",gap:12,alignItems:"center"}}><Chart kind="radial" fit="fixed" width={120} height={90} value={0.62} label="정상" tone="ok" valueFormatter={v=>Math.round(v*100)+"%"} /><KeyValues style={{flex:1}} rows={[["온도","61.5°C"],["로드 (1m)","2.41"],["실행 중","수집 안 됨"]]} /></div></Panel>
    <Panel padding="sm"><CardHead title="GPU 메모리" meta="24 GiB" metaMono /><Chart kind="pie" aria-label="VRAM" height={130} segments={[{label:"모델",value:9.2,tone:"used"},{label:"학습",value:4.1,tone:"reserved"},{label:"여유",value:10.7,tone:"free"}]} caption="GiB" valueFormatter={v=>v.toFixed(1)} /></Panel>
    <Panel padding="sm"><CardHead title="부하 프로필" /><Chart kind="radar" aria-label="부하" height={170} axes={["CPU","GPU","메모리","디스크","네트워크"]} series={[{label:"지금",tone:2,values:[62,30,71,48,12]},{label:"1시간 평균",tone:1,values:[48,22,68,40,20]}]} max={100} /></Panel>
  </div></div>
  <div className="bds-demo-section"><div className="bds-demo-label">StatTile · Sparkline</div><div className="bds-metric-grid">
    <StatTile label="요청" value={12480} unit="건" delta={320} deltaLabel="1시간" spark={[3,5,4,8,9,7,12,10,14]} tone={2} />
    <StatTile label="평균 응답" value={184} unit="ms" delta={-12} spark={[220,210,205,198,190,184]} tone={1} />
    <StatTile icon="cube" label="활성 모델" value={3} unit="개" pill={{tone:"ok",text:"실행 중"}} detail={<><Tag>ko-embed-v3</Tag><Tag>whisper</Tag></>} />
    <StatTile icon="robot" label="프로세스 자동 제어" value="사용 중" pill={{tone:"ok",text:"host agent"}} detail={<>heartbeat <span className="bds-mono">4초 전</span></>} />
  </div></div>
  <div className="bds-demo-grid-2">
    <div className="bds-demo-section"><div className="bds-demo-label">BarList</div><Panel padding="sm"><CardHead title="디스크" meta="3 volume" /><BarList aria-label="디스크별 사용량" max={100} thresholds={{warn:70,crit:90}} valueFormatter={v=>v.toFixed(1)+"%"} items={[{name:"nvme0n1 · 시스템",value:63.2},{name:"sda · 미디어",value:91.4},{name:"sdb · 백업",value:null}]} /></Panel></div>
    <div className="bds-demo-section"><div className="bds-demo-label">DescriptionList</div><Panel padding="sm"><CardHead title="모델 상세" /><DescriptionList items={[{term:"런타임",detail:"ONNX Runtime 1.19",mono:true},{term:"용도",detail:"한국어 문서 임베딩. 검색 인덱스와 RAG 컨텍스트 생성에 쓰입니다."}]} /></Panel></div>
  </div>
  <div className="bds-demo-section"><div className="bds-demo-label">DataTable</div><DataTable aria-label="서비스" header={{title:"서비스",meta:<span className="bds-mono">방금 갱신</span>}} rowKey={r=>r.name}
    rows={[{name:"ai-hub",ok:true,cpu:"3.2%",mem:"1.4 GiB",up:"12d 04:31",domain:"hub.example"},{name:"postgres-shared",ok:true,cpu:"0.8%",mem:"612 MiB",up:"31d 11:02",domain:"내부"},{name:"monitoring-api",ok:false,cpu:"수집 안 됨",mem:"수집 안 됨",up:"수집 안 됨",domain:"내부"}]}
    columns={[{key:"name",header:"이름",sortable:true},{key:"ok",header:"상태",render:r=><StatusPill size="sm" tone={r.ok?"ok":"crit"}>{r.ok?"실행 중":"응답 없음"}</StatusPill>},{key:"cpu",header:"CPU",align:"num",hideBelow:"tablet"},{key:"mem",header:"메모리",align:"num",hideBelow:"tablet"},{key:"up",header:"업타임",align:"num",hideBelow:"desktop"},{key:"domain",header:"도메인",render:r=><span className="bds-mono">{r.domain}</span>}]}
    sort={{key:"name",dir:"asc"}} onSortChange={()=>{}} expandable={r=><span className="bds-mono">CPU {r.cpu} · 메모리 {r.mem} · 업타임 {r.up}</span>} defaultExpandedKeys={["monitoring-api"]} /></div>
  <div className="bds-demo-section"><div className="bds-demo-label">LogViewer</div><LogViewer height={120} lines={[{level:"info",time:"18:42:01",text:"epoch 3/10 loss=0.412 lr=2e-5"},{level:"ok",time:"18:42:05",text:"checkpoint saved: run-0913/ckpt-3.pt"},{level:"warn",time:"18:42:09",text:"VRAM 여유 1.2 GiB, batch를 16으로 낮춥니다"},{level:"error",time:"18:42:31",text:"CUDA out of memory (attempt 1/3)"}]} /></div>
</>; }



const rnd = R(7);
const heat = ["월","화","수","목","금","토","일"].map((_, d) => Array.from({ length: 24 }, (_, h) => (d >= 5 ? 0.35 : 1) * (h < 7 ? 5 : h < 10 ? 40 : h < 19 ? 90 : 30) * (0.6 + rnd() * 0.8) | 0));
heat[2][14] = null;
const lat = Array.from({ length: 400 }, () => { const u = rnd(); return Math.round(20 + 380 * Math.pow(u, 3.2) + rnd() * 25); });
function Viz(){
  return <>
    <div className="bds-demo-grid-2">
      <div className="bds-demo-section"><div className="bds-demo-label">Heatmap · 요일×시간 요청량</div><div style={{overflowX:"auto",minWidth:0}}><Heatmap aria-label="요일·시간별 요청량" rows={["월","화","수","목","금","토","일"]} cols={Array.from({length:24},(_,h)=>`${h}시`)} colLabel={(c)=>c.replace("시","")} values={heat} valueFormatter={(v)=>`${v}건`} /></div></div>
      <div className="bds-demo-section"><div className="bds-demo-label">Chart · histogram</div><div className="bds-demo-caption">응답시간 분포 · p50 / p95</div><Chart kind="histogram" aria-label="응답시간 분포" samples={lat} unit="ms" percentiles={[0.5,0.95]} tone={1} height={170} /></div>
    </div>
    <div className="bds-demo-grid-2">
      <div className="bds-demo-section"><div className="bds-demo-label">Timeline · 최근 운영 변화</div><Timeline aria-label="최근 운영 변화" items={[
        {time:"18:40:12", tone:"ok", icon:"play", title:"ko-embed-v3 실행 중", detail:"lease granted → active · 3.0 GiB"},
        {time:"17:02:44", tone:"off", icon:"stop", title:"whisper-large 종료됨", detail:"유휴 15분 · 자동 종료"},
        {time:"16:51:03", tone:"info", icon:"hourglass", title:"llama-3.1-8b 실행 준비", detail:"readiness와 heartbeat 대기"},
        {time:"16:49:58", tone:"warn", icon:"warning", title:"ko-rerank 대기 중", detail:"VRAM 확보 대기 · 필요 3.2 GiB"}]} /></div>
      <div className="bds-demo-section"><div className="bds-demo-label">DiffView · revision 비교</div><DiffView from="rev_0827" to="rev_0913" changes={[
        {field:"prefect.recipes.finetune.epochs", from:12, to:20},
        {field:"prefect.recipes.finetune.lr", from:"1e-4", to:"5e-5"},
        {field:"dataset.schema.fields.label_weight", to:"float"},
        {field:"legacy.mount", from:"/data/raw"},
        {field:"image_digest", from:"sha256:3f1c…", to:"sha256:9a2e…"}]} /></div>
    </div>
  </>; }



const rnd2 = R(11);
const days = Array.from({length:90},(_,i)=>{ const u=rnd2(); return {status: i===61?"crit": u<.04?"warn": i>84&&i<87?"off":"ok", label: (i+1)+"일차"}; });
function More(){ return <>
  <div className="bds-demo-grid-2">
    <div className="bds-demo-section"><div className="bds-demo-label">Gauge · 임계 70/90 자동 톤 · null</div><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}><Gauge value={0.62} label="CPU" /><Gauge value={0.78} label="메모리" /><Gauge value={22.1} max={24} unit="GiB" valueFormatter={v=>v.toFixed(1)} label="VRAM" ticks /><Gauge value={null} label="온도" /></div></div>
    <div className="bds-demo-section"><div className="bds-demo-label">TrendDelta · Legend</div><div className="bds-demo-row"><TrendDelta value={0.12} percent label="1시간 전 대비" /><TrendDelta value={-12} inverse label="ms" /><TrendDelta value={320} label="건" /><TrendDelta value={0.03} percent inverse label="오류율" /><TrendDelta value={0} /><TrendDelta value={null} /></div>
      <Legend items={[{label:"수신",tone:"rx",value:"31.4 Mb/s"},{label:"송신",tone:"tx",value:"8.2 Mb/s"}]} shape="line" /><Legend items={[{label:"모델",tone:"used"},{label:"학습",tone:"reserved"},{label:"여유",tone:"free"},{label:"숨김",tone:3,hidden:true}]} onToggle={()=>{}} /></div>
  </div>
  <div className="bds-demo-section"><div className="bds-demo-label">UptimeBar</div><Panel><CardHead title="가용성" meta="90일" /><Stack><UptimeBar name="ai-hub" segments={days} start="6월 11일" end="오늘" /><UptimeBar name="monitoring-api" height={20} segments={days.map((d,i)=>i>70?{status:"off"}:d)} start="6월 11일" end="오늘" /></Stack></Panel></div>
</>; }

function App(){ return <>
  <Basic />
  <Viz />
  <More />
</>; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
