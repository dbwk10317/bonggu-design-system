<!doctype html><html lang="ko" class="dark" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./card.css"><script src="../theme-toggle.js" defer></script><style>.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.s{display:grid;gap:5px;font-size:11px;color:var(--ink-3)}.s i{display:block;height:36px;border-radius:var(--radius-ctl);border:1px solid var(--line)}.s b{color:var(--ink);font-family:var(--font-data);font-weight:500}</style></head><body class="bds-demo-page"><div class="sw"><div class="s"><i style="background:var(--canvas)"></i><b>--canvas</b></div><div class="s"><i style="background:var(--panel)"></i><b>--panel</b></div><div class="s"><i style="background:var(--panel-2)"></i><b>--panel-2</b></div><div class="s"><i style="background:var(--line)"></i><b>--line</b></div><div class="s"><i style="background:var(--ink)"></i><b>--ink</b></div><div class="s"><i style="background:var(--ink-2)"></i><b>--ink-2</b></div><div class="s"><i style="background:var(--signal)"></i><b>--signal</b></div></div><div class="sw"><div class="s"><i style="background:var(--ok)"></i><b>--ok</b></div><div class="s"><i style="background:var(--warn)"></i><b>--warn</b></div><div class="s"><i style="background:var(--crit)"></i><b>--crit</b></div><div class="s"><i style="background:var(--info)"></i><b>--info</b></div><div class="s"><i style="background:var(--series-2)"></i><b>--series-2</b></div><div class="s"><i style="background:var(--series-3)"></i><b>--series-3</b></div><div class="s"><i style="background:var(--series-4)"></i><b>--series-4</b></div></div></body></html>
