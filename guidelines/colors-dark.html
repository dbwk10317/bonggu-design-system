<!-- @dsCard group="Colors" viewport="1100x200" name="다크 테마" subtitle="같은 토큰 이름, :root.dark / [data-theme=dark]에서 명도만 반전" -->
<!doctype html><html lang="ko" class="dark" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="../theme-toggle.js" defer></script><style>body{padding:16px;display:grid;gap:10px}.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.s{display:grid;gap:5px;font-size:11px;color:var(--text-3)}.s i{display:block;height:36px;border-radius:var(--r-sm);border:1px solid var(--border)}.s b{color:var(--text);font-family:var(--font-mono);font-weight:500}</style></head><body><div class="sw"><div class="s"><i style="background:var(--bg)"></i><b>--bg</b></div><div class="s"><i style="background:var(--surface)"></i><b>--surface</b></div><div class="s"><i style="background:var(--surface-2)"></i><b>--surface-2</b></div><div class="s"><i style="background:var(--border)"></i><b>--border</b></div><div class="s"><i style="background:var(--text)"></i><b>--text</b></div><div class="s"><i style="background:var(--text-2)"></i><b>--text-2</b></div><div class="s"><i style="background:var(--accent)"></i><b>--accent</b></div></div><div class="sw"><div class="s"><i style="background:var(--ok)"></i><b>--ok</b></div><div class="s"><i style="background:var(--warn)"></i><b>--warn</b></div><div class="s"><i style="background:var(--crit)"></i><b>--crit</b></div><div class="s"><i style="background:var(--info)"></i><b>--info</b></div><div class="s"><i style="background:var(--chart-2)"></i><b>--chart-2</b></div><div class="s"><i style="background:var(--chart-3)"></i><b>--chart-3</b></div><div class="s"><i style="background:var(--chart-4)"></i><b>--chart-4</b></div></div></body></html>
