<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="./card.css"><script src="../theme-toggle.js" defer></script><style>.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.s{display:grid;gap:5px;font-size:var(--fs-caption);color:var(--ink-3)}.s i{display:block;height:44px;border-radius:var(--radius-ctl);border:1px solid var(--line)}.s b{color:var(--ink);font-weight:500;font-family:var(--font-data);font-size:var(--fs-caption)}.s span{font-family:var(--font-data)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head><body class="bds-demo-page"><div class="sw"><div class="s"><i style="background:var(--canvas)"></i><b>--canvas</b><span>바탕</span></div><div class="s"><i style="background:var(--canvas-sunken)"></i><b>--canvas-sunken</b><span>침강 바탕</span></div><div class="s"><i style="background:var(--panel)"></i><b>--panel</b><span>패널</span></div><div class="s"><i style="background:var(--panel-2)"></i><b>--panel-2</b><span>hover</span></div><div class="s"><i style="background:var(--panel-3)"></i><b>--panel-3</b><span>트랙</span></div><div class="s"><i style="background:var(--line)"></i><b>--line</b><span>선</span></div><div class="s"><i style="background:var(--line-strong)"></i><b>--line-strong</b><span>강한 선</span></div><div class="s"><i style="background:var(--hairline)"></i><b>--hairline</b><span>그리드</span></div><div class="s"><i style="background:var(--stage)"></i><b>--stage</b><span>LCD·LED 프리뷰</span></div></div></body></html>
