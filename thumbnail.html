<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}body{display:grid;grid-template-columns:1fr 320px;background:var(--signal)}
.main{display:grid;place-items:center;gap:0}.main .wrap{display:flex;align-items:center;gap:40px}
.main b{font-family:var(--font-ui);font-size:132px;font-weight:700;letter-spacing:-.03em;color:var(--signal-fg);white-space:nowrap;line-height:1}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip i{display:block}</style></head>
<body><div class="main"><div class="wrap"><svg width="190" height="190" viewBox="0 0 36 36" aria-hidden="true"><path d="M6.5 8 C2.5 9.5 2 16 4.5 19.5 C6 21.6 8.5 22.5 10.5 21.5 L12.5 12 C11.5 9 8.8 7.1 6.5 8Z" fill="var(--signal-fg)"/><path d="M29.5 8 C33.5 9.5 34 16 31.5 19.5 C30 21.6 27.5 22.5 25.5 21.5 L23.5 12 C24.5 9 27.2 7.1 29.5 8Z" fill="var(--signal-fg)"/><circle cx="18" cy="18" r="11" fill="var(--mark-face)" stroke="var(--mark-edge)" stroke-width=".75"/><circle cx="14.2" cy="16.2" r="1.5" fill="var(--mark-line)"/><circle cx="21.8" cy="16.2" r="1.5" fill="var(--mark-line)"/><ellipse cx="18" cy="20.7" rx="2.1" ry="1.55" fill="var(--mark-line)"/><path d="M14.5 23 Q18 26.1 21.5 23" fill="none" stroke="var(--mark-line)" stroke-width="1.25" stroke-linecap="round"/></svg><b>봉구 대시보드</b></div></div>
<div class="strip"><i style="background:var(--warn)"></i><i style="background:var(--series-2)"></i><i style="background:var(--ok)"></i><i style="background:var(--crit)"></i></div></body></html>
